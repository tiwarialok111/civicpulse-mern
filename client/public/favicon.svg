<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#059669"/>

  <!-- City building / civic hall silhouette -->
  <!-- Main building body -->
  <rect x="18" y="28" width="28" height="22" rx="1" fill="white" fill-opacity="0.95"/>

  <!-- Roof / pediment -->
  <polygon points="14,28 32,14 50,28" fill="white" fill-opacity="0.95"/>

  <!-- Dome on top -->
  <ellipse cx="32" cy="14" rx="5" ry="4" fill="white" fill-opacity="0.95"/>
  <rect x="30" y="10" width="4" height="5" fill="white" fill-opacity="0.95"/>

  <!-- Flagpole -->
  <line x1="32" y1="6" x2="32" y2="12" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Flag -->
  <polygon points="32,6 38,8 32,10" fill="#10b981"/>

  <!-- Door -->
  <rect x="28" y="38" width="8" height="12" rx="4" fill="#059669"/>

  <!-- Windows -->
  <rect x="20" y="32" width="5" height="5" rx="1" fill="#059669" fill-opacity="0.7"/>
  <rect x="39" y="32" width="5" height="5" rx="1" fill="#059669" fill-opacity="0.7"/>

  <!-- Columns (civic hall style) -->
  <rect x="20" y="28" width="2" height="22" fill="#059669" fill-opacity="0.15"/>
  <rect x="42" y="28" width="2" height="22" fill="#059669" fill-opacity="0.15"/>
  <rect x="27" y="28" width="2" height="22" fill="#059669" fill-opacity="0.12"/>
  <rect x="35" y="28" width="2" height="22" fill="#059669" fill-opacity="0.12"/>

  <!-- Checkmark / pulse overlay (bottom right badge) -->
  <circle cx="46" cy="46" r="10" fill="#065f46"/>
  <polyline points="40,46 44,50 52,41" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>